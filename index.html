<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Rainbow Castle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap">
<style>
:root{
  /* One-screen storybook world: full-bleed SVG scene, a castle-car parade float in the middle, toy buttons top-right */
  --sky-day:#8FD3FF;
  --sky-night:#1B1747;
  --ink:#4A3F6B;
  --btn:#FFFDF7;
  --glow:#FFE66D;
  --font-bubble:"Baloo 2","Arial Rounded MT Bold","Comic Sans MS",system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{
  margin:0;background:var(--sky-day);overflow:hidden;transition:background 1.2s;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
body.night{background:var(--sky-night)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

.controls{
  position:fixed;display:flex;gap:14px;
  right:calc(env(safe-area-inset-right,0px) + 16px);
  top:calc(env(safe-area-inset-top,0px) + 16px);
}
.btn{
  width:72px;height:72px;border-radius:50%;padding:0;cursor:pointer;
  border:4px solid var(--ink);background:var(--btn);color:var(--ink);
  display:grid;place-items:center;box-shadow:0 6px 0 var(--ink);
  transition:transform .1s, box-shadow .1s, background .3s;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--btn);outline-offset:3px}
.btn svg{width:38px;height:38px}
#brushBtn{background:var(--current,#FF5A5F)}
@media (max-width:520px){.btn{width:60px;height:60px}.btn svg{width:32px;height:32px}}
@media (max-width:420px){.controls{gap:10px}.btn{width:52px;height:52px;border-width:3px}.btn svg{width:28px;height:28px}}
@media (max-width:360px){
  .turn{font-size:18px;gap:6px;padding:4px 12px 4px 5px;border-width:3px}
  .turn svg{width:24px;height:24px}
}

/* whose turn: name badge with a ring that empties as the turn runs out */
.turn{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;padding:6px 18px 6px 8px;
  background:var(--kid,#FF9BC8);border:4px solid var(--ink);border-radius:999px;box-shadow:0 6px 0 var(--ink);
  font-family:var(--font-bubble);font-weight:700;font-size:28px;line-height:1;color:var(--ink);
  pointer-events:none;transition:background .4s;
}
.turn svg{width:40px;height:40px;transform:rotate(-90deg)}
.turn.pop{animation:turnPop .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes turnPop{0%{transform:translateX(-50%) scale(.4)}100%{transform:translateX(-50%) scale(1)}}
@media (max-width:640px){
  .turn{left:calc(env(safe-area-inset-left,0px) + 16px);transform:none;font-size:22px}
  .turn svg{width:32px;height:32px}
  @keyframes turnPop{0%{transform:scale(.4)}100%{transform:scale(1)}}
}

/* rainbow */
.band{fill:none;cursor:pointer;animation:draw 1.1s ease-out backwards}
.band.ping{animation:ping .4s ease-out}
@keyframes draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
@keyframes ping{0%{stroke-width:33}40%{stroke-width:46}100%{stroke-width:33}}

/* paintable bits */
.part{cursor:pointer;transition:fill .35s}
.boing{animation:boing .4s ease-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes boing{0%{transform:scale(1)}35%{transform:scale(1.06,.94)}65%{transform:scale(.97,1.04)}100%{transform:scale(1)}}

.window{cursor:pointer;fill:#5B5470;transition:fill .3s}
.window.lit{fill:var(--glow);filter:url(#glow)}

.wave{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(7deg) scaleX(.86)}}

/* sky */
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(1320px)}}
.cloud{cursor:pointer}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#orb{cursor:pointer}
#sun{transition:opacity 1s, transform 1s}
#moon,#nightSky,#stars{opacity:0;transition:opacity 1.2s}
body.night #sun{opacity:0;transform:translateY(60px)}
body.night #moon,body.night #nightSky,body.night #stars{opacity:1}
body:not(.night) #stars{pointer-events:none}
.twinkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
body:not(.night) .twinkle{animation:none}
.starBtn{cursor:pointer}
.zingT{transform-box:fill-box;transform-origin:center}
.zing{animation:zing .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes zing{0%{transform:scale(1) rotate(0)}45%{transform:scale(2.4) rotate(72deg)}100%{transform:scale(1) rotate(144deg)}}

/* flowers */
.flower{cursor:pointer}
.grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.petals{transition:fill .35s}

/* castle car */
#car.driving #carBody{animation:bump .22s ease-in-out infinite}
@keyframes bump{50%{transform:translateY(-6px)}}
.wheelSpin{cursor:pointer;transform-box:fill-box;transform-origin:center}
#car.driving .wheelSpin{animation:spin .4s linear infinite}
#headlight{cursor:pointer;transition:fill .6s}
body.night #headlight{fill:var(--glow);filter:url(#glow)}

#door{cursor:pointer}
#doorLeaf{transform-box:fill-box;transform-origin:0 50%;transition:transform .5s cubic-bezier(.5,1.6,.5,1)}
#door.open #doorLeaf{transform:scaleX(.1)}
#friend{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .45s .15s cubic-bezier(.3,1.8,.5,1)}
#door.open #friend{transform:scale(1)}

/* princess */
#princess{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.4s ease-in-out, opacity .35s}
#princess.gone{opacity:0;pointer-events:none}
.sky{cursor:pointer}
#birds{pointer-events:none}
.flap{transform-box:fill-box;transform-origin:center;animation:flap .26s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(-.5)}}
#eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#mouthOpen{opacity:0;transform-box:fill-box;transform-origin:center}
#princess.talking #smile{opacity:0}
#princess.talking #mouthOpen{opacity:1;animation:chatter .16s ease-in-out infinite alternate}
@keyframes chatter{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
#wandArm{transform-box:fill-box;transform-origin:0% 100%}
#wandArm.waving{animation:waveArm .45s ease-in-out 4 alternate}
@keyframes waveArm{to{transform:rotate(-28deg)}}

#bubble{pointer-events:none;opacity:0;transition:opacity .25s}
#bubble.show{opacity:1}
#bubbleText{font-family:var(--font-bubble);font-size:28px;font-weight:700;fill:var(--ink)}

#hint{pointer-events:none;transition:opacity .4s}
#hint text{animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}

@media (prefers-reduced-motion: reduce){
  .band,.drift,.rays,.wave,.twinkle,#hint text,#car.driving #carBody,#eyes{animation:none}
}
</style>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('scene');
  const COLORS = ['#FF5A5F','#FF9F1C','#FFD93D','#6BCB77','#4D96FF','#6A5ACD','#C77DFF'];
  const COLOR_NAMES = ['red','orange','yellow','green','blue','indigo','purple'];
  const NOTES  = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.5, 1174.66]; // C major pentatonic, outer band lowest
  const FRIENDS = [['🦄','unicorn'],['🐉','dragon'],['🐱','kitty'],['🐰','bunny'],['🦊','fox'],['🐻','bear'],['🧚','fairy'],['🐶','puppy']];
  const HELLOS = [
    'Hi, {k}!', "I'm Princess Carsi!", 'Tap my magic wand, {k}!', 'Do you like my car, {k}?',
    'Paint my castle car!', 'Tap the wheels to go!', 'Tap the door, {k}!',
    'Tap the sky for birdies!', 'Tap the sun for stars!', 'Tap the flowers, {k}!',
    '{k}, you are wonderful!', 'I love you, {k}!'
  ];
  // turns: one child plays for a random 2–3 minutes, then the other
  const KIDS = [{ name: 'Avni', color: '#FF9BC8' }, { name: 'Ansh', color: '#7CC4FF' }];
  let turnIdx = Math.random() < 0.5 ? 0 : 1, turnTotal = 0, turnLeft = 0, turnStarted = false, warned = false;
  const kid = () => KIDS[turnIdx].name;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  let current = 0, friendIdx = 0, hintStep = 0, helloIdx = 0, greeted = false;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function starPath(r) {
    let d = '';
    for (let k = 0; k < 10; k++) {
      const rr = k % 2 ? r * 0.45 : r, a = -Math.PI / 2 + k * Math.PI / 5;
      d += (k ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ' ' + (Math.sin(a) * rr).toFixed(1);

    ['Buzz buzz! A bee!', { ch: '🐝', n: 2, vy: [-1.5, -1], vx: 3, sw: 30, vr: 0.4, decay: 0.006 }],
    ['A ladybug!', { ch: '🐞', n: 3, vy: [-1.2, -0.6], sw: 6, size: [20, 28] }],
    ['A balloon!', { ch: '🎈', n: 1, vy: [-1.4, -1.1], sw: 6, vr: 0.05, decay: 0.004, size: [46, 54] }],
    ['Love hearts!', { ch: '💖', n: 6, vy: [-3, -1.5], vx: 2, sw: 10, decay: 0.01 }],
    ['Shiny stars!', { ch: '⭐', n: 6, vy: [-5, -2.5], vx: 3, g: 0.08, sw: 0, decay: 0.012 }],
    ['La la la!', { ch: ['🎵', '🎶'], n: 4, vy: [-2.2, -1.2], vx: 1.5, sw: 12 }, () => [0, 2, 4, 2, 0].forEach((n, k) => bell(NOTES[n], k * 0.15))],
    ['Pretty petals!', { ch: '🌸', n: 8, vy: [-4, -2], vx: 3, g: 0.06, sw: 18, size: [18, 26], decay: 0.01 }],
    ['Bubbles!', { ch: '🫧', n: 6, vy: [-2, -1], vx: 1.5, sw: 18, size: [26, 44], decay: 0.006 }],
    ['A tiny fairy!', { ch: '🧚', n: 1, vy: [-2, -1.6], sw: 24, vr: 0.08, decay: 0.005, size: [42, 48] }]
  ];
  function tapFlower(fl, x, y) {
    const i = +fl.g.dataset.i;
    const [words, gift, extra] = FLOWER_GIFTS[i];
    fl.petals.style.fill = COLORS[current];
    fl.scale = fl.scale >= 2 ? 1 : fl.scale + 0.25;
    fl.grow.style.transform = `scale(${fl.scale})`;
    if (extra) extra(); else bell(NOTES[i % 7]);
    burst(x, y, [COLORS[current], '#FFFFFF'], 10, 3.5);
    release(x, y - 20, gift);
    chat(words, 0.8, 2500);
  }

  // drive off one side and come back around the other
  let drivePhase = 0, trailTimer = 0;
  function horn() {
    voice(659.25, { dur: 0.18, vol: 0.25, type: 'triangle' });
    voice(783.99, { dur: 0.22, vol: 0.25, type: 'triangle', when: 0.2 });
  }
  function driveCar() {
    if (drivePhase || visiting) return;
    drivePhase = 1;
    car.classList.add('driving');
    horn();
    say('Here we go!');
    setTimeout(() => {
      car.style.transition = 'transform 1.5s cubic-bezier(.5,0,.9,.6)';
      car.style.transform = 'translateX(1150px)';
    }, 450);
    trailTimer = setInterval(() => {
      const r = car.getBoundingClientRect();
      bits.push({ x: r.left + r.width * 0.05, y: r.top + r.height * 0.75, vx: -rand(0.5, 2), vy: -rand(0.5, 2),
        g: -0.02, life: 1, decay: 0.02, size: rand(5, 9),
        color: COLORS[Math.floor(Math.random() * COLORS.length)], shape: 'heart', rot: 0, vr: 0 });
    }, reduced ? 240 : 60);
  }
  car.addEventListener('transitionend', e => {
    if (e.target !== car || e.propertyName !== 'transform') return;
    if (drivePhase === 1) {
      drivePhase = 2;
      car.style.transition = 'none';
      car.style.transform = 'translateX(-1150px)';
      void car.getBoundingClientRect();
      car.style.transition = 'transform 1.8s cubic-bezier(.2,.6,.3,1)';
      car.style.transform = 'translateX(0px)';
    } else if (drivePhase === 2) {
      drivePhase = 0;
      clearInterval(trailTimer);
      car.classList.remove('driving');
      [783.99, 987.77, 1174.66, 1567.98].forEach((f, k) => bell(f, k * 0.08));
      const c = centerOf(princess);
      burst(c.x, c.y - 40, ['#FF9BC8', '#FFD84D', '#FFFFFF'], 20, 4);
      say('Wheee! That was fun!');
    }
  });

  function magic() {
    audio();
    say('Rainbow magic!');
    const order = [...parts].sort(() => Math.random() - 0.5);
    order.forEach((p, k) => setTimeout(() => {
      const c = centerOf(p);
      paint(p, c.x, c.y, COLORS[k % COLORS.length], true);
      bell(NOTES[k % NOTES.length]);
    }, k * 120));
    flowers.forEach((fl, k) => setTimeout(() => { fl.petals.style.fill = COLORS[k % 7]; }, k * 80));
    const done = order.length * 120;
    for (let k = 0; k < 6; k++) setTimeout(() => {
      const c = toScreen(220 + Math.random() * 560, 90 + Math.random() * 170);
      burst(c.x, c.y, COLORS, 40, 7, 0.06);
      voice(300, { dur: 0.5, vol: 0.12, type: 'triangle', slideTo: 1400 });
    }, done + k * 260);
    if (hintStep < 2) { hintStep = 2; hint.style.opacity = 0; }
  }
  function reset() {
    audio();
    parts.forEach(p => { p.style.fill = ''; });
    windows.forEach(w => w.classList.remove('lit'));
    flowers.forEach(fl => { fl.scale = 1; fl.grow.style.transform = ''; fl.petals.style.fill = ''; });
    door.classList.remove('open');
    document.body.classList.remove('night');
    [...NOTES].reverse().forEach((f, k) => bell(f / 2, k * 0.06));
    say("Let's paint again!");
  }

  // ---------- input: tap, or drag a finger across the rainbow, stars and flowers ----------
  let dragging = false, last = null;
  function hit(target, x, y, isDown) {
    const band = target.closest('.band');
    const star = target.closest('.starBtn');
    const flowerG = target.closest('.flower');
    const part = target.closest('.part');
    const key = band || star || flowerG || part;
    const fresh = key !== last;
    last = key;

    if (band) { if (fresh) pickBand(+band.dataset.i, x, y); return; }
    if (star) { if (fresh) tapStar(star, x, y); return; }
    if (flowerG) { if (fresh) tapFlower(flowers[+flowerG.dataset.i], x, y); return; }
    if (target.closest('#princess')) {
      if (isDown) tapPrincess(target, x, y);
      else if (part && fresh) paint(part, x, y);
      return;
    }
    if (part) { if (fresh) paint(part, x, y); return; }
    if (!isDown) return;
    if (target.closest('.wheelSpin') || target.closest('#headlight')) return driveCar();
    const w = target.closest('.window'); if (w) return toggleWindow(w, x, y);
    if (target.closest('#door')) return toggleDoor();
    if (target.closest('#orb')) return toggleNight();
    const cloud = target.closest('.cloud'); if (cloud) return cloudRain(cloud, x, y);
    if (target.classList.contains('sky')) { const p = toSvg(x, y); addBirds(p.x, p.y); }
  }
  svg.addEventListener('pointerdown', e => {
    audio();
    dragging = true; last = null;
    hit(e.target, e.clientX, e.clientY, true);
    if (!greeted) {
      greeted = true;
      if (!talking) setTimeout(() => chat(`Hi ${kid()}! It's your turn!`), 500);
    }
    turnStarted = true;
  });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const t = document.elementFromPoint(e.clientX, e.clientY);
    if (t && svg.contains(t)) hit(t, e.clientX, e.clientY, false);
  });
  ['pointerup', 'pointercancel'].forEach(t => addEventListener(t, () => { dragging = false; }));

  brushBtn.addEventListener('click', () => {
    const i = (current + 1) % COLORS.length;
    const b = rainbow.children[i].getBoundingClientRect();
    pickBand(i, b.left + b.width / 2, b.top + 10);
  });
  document.getElementById('magicBtn').addEventListener('click', magic);
  document.getElementById('resetBtn').addEventListener('click', reset);

  const turnBadge = document.getElementById('turn');
  const turnName = document.getElementById('turnName');
  const turnRing = document.getElementById('turnRing');
  function showTurn() {
    turnName.textContent = KIDS[turnIdx].name;
    turnBadge.style.setProperty('--kid', KIDS[turnIdx].color);
    turnRing.setAttribute('stroke-dashoffset', 0);
    turnTotal = turnLeft = Math.round(rand(120, 180));
    warned = false;
  }
  function switchTurn() {
    turnIdx = 1 - turnIdx;
    showTurn();
    replay(turnBadge, 'pop');
    const r = turnBadge.getBoundingClientRect();
    burst(r.left + r.width / 2, r.bottom, [KIDS[turnIdx].color, ...COLORS], 40, 7, 0.1);
    [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, k) => bell(f, k * 0.12));
    say(`Time to switch! ${kid()}'s turn!`);
  }
  setInterval(() => {
    if (!turnStarted || document.hidden) return;
    turnLeft--;
    turnRing.setAttribute('stroke-dashoffset', (100 * (1 - turnLeft / turnTotal)).toFixed(1));
    if (turnLeft === 15 && !warned) { warned = true; say(`Almost time, ${kid()}!`); }
    if (turnLeft <= 0) switchTurn();
  }, 1000);
  showTurn();

  setColor(0);
})();
</script>

</html>
