<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Swimming Pool · Rainbow Castle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap">
<link rel="stylesheet" href="pool.css">
</head>
<body>

<!-- Side view of the castle's indoor pool: shallow end with steps on the left, deep end and ladder on the right.
     Scene units: deck top y=560, water surface y=590, shallow floor y=735, deep floor y=800, pool x=160..880. -->
<div id="stage">
<svg id="scene" viewBox="40 110 920 690" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="The castle swimming pool. Princess Carsi is the swim teacher. Choose a swimming step at the bottom: Carsi shows it, then you copy it.">
  <defs>
    <pattern id="wallTiles" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#FBEFFF"/><path d="M48 0 V48 H0" fill="none" stroke="#EEDCF7" stroke-width="2"/>
    </pattern>
    <pattern id="poolTiles" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#B4ECFB"/><path d="M36 0 V36 H0" fill="none" stroke="#8FDCF0" stroke-width="2"/>
    </pattern>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC8FF" stop-opacity=".35"/><stop offset="1" stop-color="#2E8FE0" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3FF"/><stop offset="1" stop-color="#E3F5FF"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- back wall -->
  <rect x="-3000" y="-3000" width="7000" height="3560" fill="url(#wallTiles)"/>
  <g id="windows"></g>
  <g id="stars"></g>
  <g id="bunting"></g>
  <rect x="-3000" y="470" width="7000" height="18" fill="#FFFFFF" opacity=".6"/>
  <g id="mosaic"></g>

  <!-- whale fountain on the rim -->
  <g id="whale" class="tappable" transform="translate(560 548)" aria-label="Whale fountain">
    <circle r="44" cy="-10" fill="transparent"/>
    <path d="M-40 0 Q-40 -34 -4 -34 Q30 -34 36 -6 Q44 -14 52 -26 Q54 -6 40 2 Q20 10 -30 8 Q-40 6 -40 0 Z" fill="#7CC4FF" stroke="#4A3F6B" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="-20" cy="-14" r="4" fill="#4A3F6B"/>
    <path d="M-30 -2 Q-18 4 -6 -2" fill="none" stroke="#4A3F6B" stroke-width="3" stroke-linecap="round"/>
    <path id="spout" d="M-6 -36 Q-10 -60 -22 -66 M-6 -36 Q-2 -62 10 -66" fill="none" stroke="#7FD0FF" stroke-width="5" stroke-linecap="round" opacity="0"/>
  </g>

  <!-- decks and the pool -->
  <rect x="-3000" y="560" width="3160" height="3000" fill="#E6D3F2"/>
  <rect x="880" y="560" width="3120" height="3000" fill="#E6D3F2"/>
  <rect x="-3000" y="552" width="3166" height="20" rx="6" fill="#FFF6E6" stroke="#4A3F6B" stroke-width="4"/>
  <rect x="874" y="552" width="3126" height="20" rx="6" fill="#FFF6E6" stroke="#4A3F6B" stroke-width="4"/>
  <path d="M160 572 V735 H600 Q650 735 700 800 H880 V572 Z" fill="url(#poolTiles)" stroke="#4A3F6B" stroke-width="4"/>
  <path d="M160 735 H600 Q650 735 700 800 H880 V3000 H160 Z" fill="#E6D3F2" stroke="#4A3F6B" stroke-width="4"/>
  <path d="M300 718 H560 M740 783 H860" stroke="#6A5ACD" stroke-width="8" stroke-linecap="round" opacity=".35"/>
  <!-- steps into the shallow end -->
  <g fill="#F2FBFF" stroke="#4A3F6B" stroke-width="4" stroke-linejoin="round">
    <path d="M162 605 H205 V735 H162 Z"/><path d="M205 650 H250 V735 H205 Z"/><path d="M250 695 H295 V735 H250 Z"/>
  </g>
  <!-- ladder out of the deep end -->
  <g stroke="#B9C2D9" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M846 700 V540 Q846 520 866 520 Q880 520 880 540"/><path d="M868 700 V560"/>
    <path d="M846 600 H868 M846 640 H868 M846 680 H868"/>
  </g>
  <!-- beach ball on the right deck -->
  <g id="ball" class="tappable" transform="translate(940 524)" aria-label="Beach ball">
    <g class="ballBounce">
      <circle r="27" fill="#FFFFFF" stroke="#4A3F6B" stroke-width="4"/>
      <path d="M0 -27 Q-18 0 0 27 Q-30 18 -27 0 Q-28 -16 0 -27 Z" fill="#FF5A5F"/>
      <path d="M0 -27 Q18 0 0 27 Q30 18 27 0 Q28 -16 0 -27 Z" fill="#4D96FF"/>
      <circle r="27" fill="none" stroke="#4A3F6B" stroke-width="4"/>
    </g>
  </g>
  <!-- life jacket on a hook -->
  <g id="vestHook" transform="translate(930 430)">
    <circle r="5" fill="#4A3F6B"/>
    <path d="M-20 4 L-6 4 L-6 60 L-22 60 Q-25 30 -20 4 Z M20 4 L6 4 L6 60 L22 60 Q25 30 20 4 Z" fill="#FF9F1C" stroke="#4A3F6B" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- tap the water (sits behind the swimmers so tapping them still reaches them) -->
  <rect id="hitWater" class="tappable" x="160" y="584" width="720" height="220" fill="transparent"/>
  <g id="under"></g>
  <g id="swimmers"></g>
  <g id="toys"></g>
  <text id="hand" x="0" y="0" font-size="60" text-anchor="middle" opacity="0" aria-hidden="true">🤲</text>
  <g id="bucket" opacity="0" aria-hidden="true"><text class="tip" x="0" y="0" font-size="56" text-anchor="middle">🪣</text></g>

  <!-- water in front of everything below the surface, so whatever is underwater looks tinted -->
  <path d="M160 590 V735 H600 Q650 735 700 800 H880 V590 Z" fill="url(#waterGrad)" pointer-events="none"/>
  <g pointer-events="none">
    <path id="surface" d="M-40 590 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".9" clip-path="url(#poolTop)"/>
  </g>
  <clipPath id="poolTop"><rect x="162" y="560" width="716" height="60"/></clipPath>

  <!-- rubber duck, bobbing at the deep end -->
  <g id="duck" class="tappable" transform="translate(810 586)" aria-label="Rubber duck">
    <g class="duckBob">
      <circle r="38" cy="-10" fill="transparent"/>
      <path d="M-28 -6 Q-30 14 0 14 Q28 14 30 -4 Q14 0 4 -10 Z" fill="#FFD84D" stroke="#4A3F6B" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="10" cy="-20" r="14" fill="#FFD84D" stroke="#4A3F6B" stroke-width="4"/>
      <path d="M22 -20 L34 -16 L22 -12 Z" fill="#FF9F1C" stroke="#4A3F6B" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="13" cy="-23" r="2.6" fill="#4A3F6B"/>
    </g>
  </g>
</svg>
</div>

<canvas id="fx"></canvas>

<header class="top">
  <button class="btn" id="homeBtn" aria-label="Back to the castle">
    <svg viewBox="0 0 40 40" fill="none" stroke="#4A3F6B" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M7 34 V16 H13 V20 H17 V16 H23 V20 H27 V16 H33 V34 Z" fill="#E6DDF0"/>
      <path d="M17 34 V28 A3 3 0 0 1 23 28 V34" fill="#B97D48"/>
      <path d="M10 16 L10 6 L16 9 L10 12"/>
    </svg>
  </button>
  <div class="kids" id="kids" role="status" aria-live="polite"></div>
  <button class="btn" id="soundBtn" aria-label="Sound" aria-pressed="true">
    <svg viewBox="0 0 40 40" fill="none" stroke="#4A3F6B" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M6 16 H13 L21 9 V31 L13 24 H6 Z" fill="#FFD84D"/>
      <g class="soundOn"><path d="M26 15 Q30 20 26 25"/><path d="M30 11 Q37 20 30 29"/></g>
      <g class="soundOff"><path d="M27 15 L35 25 M35 15 L27 25"/></g>
    </svg>
  </button>
</header>

<div id="bubble" class="bubble" aria-live="polite"></div>
<div id="peek" class="peek" hidden aria-hidden="true"><div class="peekWater"><span id="peekThing"></span></div><span class="peekEyes">👀</span></div>
<div id="dots" class="dots" hidden aria-hidden="true"></div>

<nav id="dock" class="dock" aria-label="Swimming steps"></nav>
<div id="pointer" class="pointer" hidden aria-hidden="true">👆</div>
<div id="curtain" class="curtain" aria-hidden="true"></div>

<script type="module" src="pool.js"></script>
</body>
</html>
