<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>School · Rainbow Castle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap">
<link rel="stylesheet" href="school.css">
</head>
<body>

<!-- the school yard: Princess Carsi's castle car drives up to the school, then she goes in to class.
     Taps: the door (into class), the windows (classmates wave), the bell, the clock, the car. -->
<svg id="scene" viewBox="0 0 1000 750" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Princess Carsi's castle car parked in front of the school. Tap the school door to go in to class.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD3FF"/><stop offset="1" stop-color="#D9F1FF"/></linearGradient>
  </defs>
  <rect x="-3000" y="-3000" width="7000" height="3700" fill="url(#sky)"/>
  <g id="sun" transform="translate(110 100)"><circle r="46" fill="#FFD84D"/><circle r="62" fill="#FFD84D" opacity=".25"/></g>
  <g fill="#FFFFFF">
    <g transform="translate(260 120)"><ellipse cx="40" cy="12" rx="70" ry="22"/><circle cx="10" cy="0" r="28"/><circle cx="48" cy="-14" r="34"/></g>
    <g transform="translate(800 80) scale(.8)"><ellipse cx="40" cy="12" rx="70" ry="22"/><circle cx="10" cy="0" r="28"/><circle cx="48" cy="-14" r="34"/></g>
  </g>

  <!-- grass and road, like at the castle -->
  <path d="M-3000 600 L-200 600 Q300 520 700 560 Q950 585 1300 540 L4000 540 L4000 4000 L-3000 4000 Z" fill="#8EDC6E"/>
  <rect x="-3000" y="628" width="7000" height="64" fill="#F2DFAE"/>
  <line x1="-3000" y1="660" x2="4000" y2="660" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="34 30" opacity=".8"/>
  <rect x="-3000" y="692" width="7000" height="3000" fill="#6CCB5F"/>

  <!-- the school -->
  <g id="school" stroke="#4A3F6B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- bell tower -->
    <g id="bellTower" class="tap" role="button" tabindex="0" aria-label="The school bell">
      <rect x="625" y="186" width="70" height="80" fill="#FFF4D6"/>
      <polygon points="612,188 660,138 708,188" fill="#FF7A7A"/>
      <g id="bell"><path d="M646 250 Q646 214 660 212 Q674 214 674 250 Z" fill="#FFD84D"/><circle cx="660" cy="254" r="5" fill="#FFD84D"/></g>
    </g>
    <rect x="460" y="330" width="400" height="290" fill="#FFE08A"/>
    <polygon points="440,334 660,230 880,334" fill="#FF9B9B"/>
    <!-- clock in the gable -->
    <g id="clock" class="tap" role="button" tabindex="0" aria-label="The school clock">
      <circle cx="660" cy="296" r="26" fill="#FFFDF7"/>
      <line id="hourHand" x1="660" y1="296" x2="660" y2="280" stroke-width="4"/>
      <line id="minHand" x1="660" y1="296" x2="674" y2="296" stroke-width="3"/>
    </g>
    <!-- four windows; classmates pop up in them when tapped -->
    <g id="windows"></g>
    <!-- the door, with a little 123 sign above it -->
    <rect x="626" y="436" width="68" height="28" rx="8" fill="#FFFDF7" stroke-width="3"/>
    <text x="660" y="457" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="700" font-size="20" fill="#4D96FF" stroke="none">123</text>
    <g id="door" class="tap" role="button" tabindex="0" aria-label="The school door. Go in to class.">
      <rect x="610" y="476" width="100" height="144" fill="#3A2E4F"/>
      <g class="leaf leafL"><rect x="610" y="476" width="50" height="144" fill="#7CC4FF"/><circle cx="650" cy="552" r="4" fill="#FFD84D"/></g>
      <g class="leaf leafR"><rect x="660" y="476" width="50" height="144" fill="#7CC4FF"/><circle cx="670" cy="552" r="4" fill="#FFD84D"/></g>
    </g>
    <path d="M590 620 H730 V632 H590 Z" fill="#E6DDF0"/>
  </g>

  <!-- the castle car with Princess Carsi (drives in from the left) -->
  <g id="car" class="tap" role="button" tabindex="0" aria-label="Princess Carsi's castle car">
    <ellipse cx="260" cy="664" rx="150" ry="9" fill="#4A3F6B" opacity=".15"/>
    <g id="carBody" stroke="#4A3F6B" stroke-width="4" stroke-linejoin="round">
      <rect x="130" y="470" width="52" height="96" fill="#E6DDF0"/>
      <polygon points="122,472 156,420 190,472" fill="#A9B3D6"/>
      <rect x="182" y="500" width="84" height="66" fill="#F1EAF7"/>
      <rect x="186" y="486" width="16" height="16" fill="#F1EAF7"/><rect x="216" y="486" width="16" height="16" fill="#F1EAF7"/><rect x="246" y="486" width="16" height="16" fill="#F1EAF7"/>
      <path d="M210 566 V546 A14 14 0 0 1 238 546 V566 Z" fill="#B97D48"/>
      <rect x="110" y="560" width="300" height="66" rx="30" fill="#FF9BC8"/>
      <g class="wheel"><circle cx="170" cy="636" r="26" fill="#FFD84D"/><circle cx="170" cy="636" r="8" fill="#FF9BC8"/><line x1="170" y1="612" x2="170" y2="660"/></g>
      <g class="wheel"><circle cx="350" cy="636" r="26" fill="#FFD84D"/><circle cx="350" cy="636" r="8" fill="#FF9BC8"/><line x1="350" y1="612" x2="350" y2="660"/></g>
    </g>
    <!-- Princess Carsi standing on the front deck (walks to the door) -->
    <g id="carsi">
      <g transform="translate(296 418) scale(.75)">
        <g stroke="#4A3F6B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M34 52 Q28 98 40 112 L80 112 Q92 98 86 52 Z" fill="#7A4A2A"/>
          <path d="M74 112 L96 90" stroke-width="12"/><path d="M74 112 L96 90" stroke="#F7CBA8" stroke-width="6"/>
          <path d="M46 112 L32 140" stroke-width="12"/><path d="M46 112 L32 140" stroke="#F7CBA8" stroke-width="6"/>
          <path d="M22 186 Q30 128 46 104 L74 104 Q90 128 98 186 Z" fill="#A77BFF"/>
          <path d="M46 106 L74 106 L70 84 L50 84 Z" fill="#A77BFF"/>
          <rect x="55" y="70" width="10" height="16" fill="#F7CBA8"/>
          <circle cx="60" cy="52" r="23" fill="#F7CBA8"/>
          <path d="M37 50 Q38 26 60 26 Q82 26 83 50 Q72 38 60 41 Q48 38 37 50 Z" fill="#7A4A2A"/>
          <polygon points="45,31 47,11 53,23 60,7 67,23 73,11 75,31" fill="#FFD84D"/>
        </g>
        <g fill="#4A3F6B"><circle cx="52" cy="54" r="3.4"/><circle cx="68" cy="54" r="3.4"/></g>
        <circle cx="45" cy="62" r="5" fill="#FF9EB5" opacity=".7"/><circle cx="75" cy="62" r="5" fill="#FF9EB5" opacity=".7"/>
        <path d="M53 64 Q60 71 67 64" fill="none" stroke="#4A3F6B" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>

<canvas id="fx"></canvas>

<header class="top">
  <button class="btn" id="homeBtn" aria-label="Drive back to the castle">
    <svg viewBox="0 0 40 40" fill="none" stroke="#4A3F6B" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M7 34 V16 H13 V20 H17 V16 H23 V20 H27 V16 H33 V34 Z" fill="#E6DDF0"/>
      <path d="M17 34 V28 A3 3 0 0 1 23 28 V34" fill="#B97D48"/>
      <path d="M10 16 L10 6 L16 9 L10 12"/>
    </svg>
  </button>
  <div class="kids" id="kids" role="status" aria-live="polite"></div>
  <button class="btn" id="soundBtn" aria-label="Sound" aria-pressed="true">
    <svg viewBox="0 0 40 40" fill="none" stroke="#4A3F6B" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M6 16 H13 L21 9 V31 L13 24 H6 Z" fill="#FFD84D"/>
      <g class="soundOn"><path d="M26 15 Q30 20 26 25"/><path d="M30 11 Q37 20 30 29"/></g>
      <g class="soundOff"><path d="M27 15 L35 25 M35 15 L27 25"/></g>
    </svg>
  </button>
</header>

<div id="bubble" class="bubble" aria-live="polite"></div>
<div id="pointer" class="pointer" hidden aria-hidden="true">👇</div>
<div id="curtain" class="curtain" aria-hidden="true"></div>

<script type="module" src="school.js"></script>
</body>
</html>
